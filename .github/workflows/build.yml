name: Build debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # the secrets are masked by GitHub, do not print them
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          test -s "$RUNNER_TEMP/debug.keystore" || { echo "the keystore secret is empty or invalid"; exit 1; }

      - name: Assemble debug APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/debug.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: PCAPdroid-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
